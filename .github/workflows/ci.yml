name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # Ninguno de los dos puede probar la plataforma del otro en local:
    # esta matriz es lo único que avisa cuando se rompe la otra.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: make build
      - run: make test
